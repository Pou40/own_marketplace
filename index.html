<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop</title>
  <meta name="description" content="Pre-loved clothes, electronics and home goods for sale.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="./" data-shop-name>Shop</a>
      <nav class="nav">
        <a href="#shop">Shop</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-shop-name>Shop</h1>
      <p data-tagline></p>
      <div class="stats" id="stats"></div>
    </section>

    <section id="shop">
      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search items, brands, sizes…" aria-label="Search">
        </label>
        <select id="sort" class="select" aria-label="Sort">
          <option value="new">Newest first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="discount">Biggest discount</option>
        </select>
        <label class="check"><input type="checkbox" id="hideSold"> Hide sold</label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="container">
      <div>© <span data-year></span> <span data-shop-name></span> · <span data-location></span></div>
      <div>Questions? <span data-contact-links></span></div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
